name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect repository and verify Android project structure
        id: inspect
        run: |
          echo "=== Inspecting Repository ==="

          # Locate Gradle wrapper
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::Gradle wrapper ('gradlew') could not be found in the repository."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
          echo "Android project root found at: $PROJECT_ROOT"

          # Verify Gradle wrapper files
          if [ ! -f "$PROJECT_ROOT/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::Gradle wrapper configuration ('gradle/wrapper/gradle-wrapper.properties') could not be found."
            exit 1
          fi

          # Verify Android application module or build config
          APP_MODULE=""
          if [ -f "$PROJECT_ROOT/settings.gradle" ] || [ -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            echo "Settings file found."
          else
            echo "::error::Android project settings file ('settings.gradle' or 'settings.gradle.kts') could not be found."
            exit 1
          fi

          # Search for module with com.android.application plugin or build.gradle with android configuration
          for file in $(find "$PROJECT_ROOT" -maxdepth 3 -name "build.gradle" -o -name "build.gradle.kts"); do
            if grep -q "com.android.application" "$file" 2>/dev/null || grep -q "id('com.android.application')" "$file" 2>/dev/null || grep -q 'id("com.android.application")' "$file" 2>/dev/null; then
              APP_MODULE=$(dirname "$file")
              break
            fi
          done

          if [ -z "$APP_MODULE" ]; then
            # Fallback: check if 'app' directory with build.gradle exists
            if [ -f "$PROJECT_ROOT/app/build.gradle" ] || [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
              APP_MODULE="$PROJECT_ROOT/app"
            elif [ -f "$PROJECT_ROOT/build.gradle" ] || [ -f "$PROJECT_ROOT/build.gradle.kts" ]; then
              APP_MODULE="$PROJECT_ROOT"
            else
              echo "::error::Android application module could not be found."
              exit 1
            fi
          fi

          echo "Application module found at: $APP_MODULE"

          echo "project_root=$PROJECT_ROOT" >> $GITHUB_OUTPUT
          echo "gradlew_path=$GRADLEW_PATH" >> $GITHUB_OUTPUT

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Give Gradle wrapper permission to run
        run: |
          chmod +x "${{ steps.inspect.outputs.gradlew_path }}"

      - name: Remove stale project-level Gradle and application build caches
        run: |
          echo "Removing stale project and Gradle build caches..."
          PROJECT_ROOT="${{ steps.inspect.outputs.project_root }}"
          rm -rf "$PROJECT_ROOT/.gradle"
          rm -rf "$PROJECT_ROOT"/*/build
          rm -rf "$PROJECT_ROOT"/build
          rm -rf ~/.gradle/caches/

      - name: Build debug APK with Gradle wrapper
        run: |
          PROJECT_ROOT="${{ steps.inspect.outputs.project_root }}"
          cd "$PROJECT_ROOT"
          ./gradlew assembleDebug --stacktrace

      - name: Locate and verify generated APK
        id: locate_apk
        run: |
          PROJECT_ROOT="${{ steps.inspect.outputs.project_root }}"
          echo "Searching for generated debug APK files in $PROJECT_ROOT..."

          # Search for APK files inside build outputs
          APK_PATHS=$(find "$PROJECT_ROOT" -type f -name "*.apk" | grep -i "debug" || find "$PROJECT_ROOT" -type f -name "*.apk" || true)

          if [ -z "$APK_PATHS" ]; then
            echo "::error::No valid APK file was generated by the build process."
            exit 1
          fi

          # Select the first matching APK
          FIRST_APK=$(echo "$APK_PATHS" | head -n 1)
          if [ ! -f "$FIRST_APK" ] || [ ! -s "$FIRST_APK" ]; then
            echo "::error::Generated APK file is missing or empty: $FIRST_APK"
            exit 1
          fi

          echo "Found valid APK: $FIRST_APK"
          echo "apk_path=$FIRST_APK" >> $GITHUB_OUTPUT

          echo "All generated APK files:"
          echo "$APK_PATHS"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 7
